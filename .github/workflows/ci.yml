# AURORA 的自動化 Gate。
#
# 為什麼這個檔案存在：維護者在 Windows、另一位開發者在 macOS，兩人都無法在
# 本機驗證對方的平台。CI 不是為了省事，是這個組合下唯一能防止互相破壞的機制。
# 詳見 PROJECT_PLAN.md 的「驗證不對稱」一節。
#
# 兩個 job 都必須是 required check，缺一不可。這不是形式：
# 上層走 aurora.platform.adapter() 之後，破壞另一個平台的改動在自己機器上
# 完全看不出來。tests/test_platform.py 有靜態檢查擋「直接 import
# platform_win」，但真正證明 macOS 還活著的只有 macos job。
#
# 刻意**不**在每次 CI 都跑的東西（見 PROJECT_PLAN.md §6.1）：
#   * -m "audio" 的測試 —— runner 沒有音訊裝置
#   * frozen bundle verify —— 只有封裝敏感的 PR 才在各平台 job 內條件式執行
#   * benchmark 的權威數字 —— hosted runner 是共用 VM，尾端數字不可信

name: CI

# CI 只需要讀取倉庫內容。明確縮小 GITHUB_TOKEN 權限，避免未來新增步驟時
# 默默繼承 repository default 的較寬權限。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一個分支連續推送時，取消還在跑的舊 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 供應鏈依賴固定到官方 release commit，避免浮動 tag 被重指。
      # actions/checkout v7.0.1 — Node 24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # 封裝 gate 需要比較 PR 的 base/head，完整歷史讓判定不依賴額外 API 或浮動 action。
          fetch-depth: 0

      # uv 會依 pyproject.toml 的 requires-python 自行取得 3.11。
      # astral-sh/setup-uv v10.3.3 — Node 24；固定到 immutable release commit。
      - name: 安裝 uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: 同步相依
        run: uv sync --dev

      - name: 判定 Windows 封裝 gate
        id: packaging
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/ci\.yml|pyproject\.toml|uv\.lock|aurora\.spec|tools/(build_exe|pyinstaller_gate)\.py|src/aurora/__init__\.py|src/aurora/__main__\.py|src/aurora/core/paths\.py|src/aurora/platform/|src/aurora/platform_win/|src/aurora/qml/|data/)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Windows frozen bundle verification required."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No Windows packaging-sensitive changes."
          fi

      # ---------------------------------------------------------------- 測試素材
      #
      # tests/_generated/ 不進版控，要用 ffmpeg 現做。素材是確定性的
      # （build_signal() 有固定種子），所以可以安全快取；快取命中時連
      # ffmpeg 都不必裝。
      #
      # 快取 key 綁在產生器的內容雜湊上：改了 make_test_audio.py 就重做。

      - name: 還原測試素材快取
        id: fixtures
        # actions/cache v6.1.0 — Node 24；固定到官方 release commit。
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tests/_generated
          key: fixtures-${{ runner.os }}-${{ hashFiles('tools/make_test_audio.py') }}

      # runner 映像檔沒有預裝 ffmpeg，但有 Chocolatey。
      # 2026-08 對 windows-2025-vs2026 映像檔（windows-latest 目前指向它）
      # 的 Included Software 清單確認過，整份找不到 ffmpeg。
      - name: 安裝 ffmpeg
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: choco install ffmpeg -y --no-progress

      # PYTHONUTF8：這個腳本會印中文，輸出被重導向時 Windows 會退回
      # cp1252／cp950 然後丟 UnicodeEncodeError。
      - name: 產生測試素材
        if: steps.fixtures.outputs.cache-hit != 'true'
        env:
          PYTHONUTF8: "1"
        run: uv run python tools/make_test_audio.py

      # 這一步是防「綠燈但其實沒測到」。素材不存在時相關測試是 skip 而不是
      # fail，所以少了素材整個套件會縮水卻依然全綠。寧可在這裡爆掉。
      - name: 確認素材齊全
        shell: bash
        run: |
          missing=0
          for f in test.wav test.flac test.ogg test_128k.mp3 test_320k.mp3 \
                   fake_lossless.flac cover.png test.lrc test_320k.lrc; do
            if [ ! -s "tests/_generated/$f" ]; then
              echo "缺少或為空：tests/_generated/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "測試素材不完整，測試套件會靜默縮水。"; exit 1; }
          echo "素材齊全。"

      # ---------------------------------------------------------------- Gate

      - name: Ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      # -m "not audio" 排除會實際開啟音訊裝置的測試；runner 沒有音效卡。
      # -rs 讓 skip 的原因出現在 log 裡 —— 大量 skip 是套件縮水的徵兆。
      - name: pytest
        run: uv run pytest -m "not audio" -rs

      # Python 的 gate 一行 QML 都不看，這是唯一覆蓋 QML 的自動化檢查。
      # 它只證明「載得起來」，不證明畫面正確。
      - name: QML 離屏載入
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run aurora --validate-qml

      # 封裝敏感 PR 必須在真正 frozen 的 EXE 內再驗一次 QML、platform adapter、
      # 必要 DLL/CFFI 模組與禁止的 Qt 贅重內容。這不是每個 PR 都跑的昂貴 gate。
      - name: Windows frozen bundle 驗證
        if: github.event_name == 'pull_request' && steps.packaging.outputs.required == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python tools/build_exe.py --verify

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # 供應鏈依賴固定到官方 release commit，避免浮動 tag 被重指。
      # actions/checkout v7.0.1 — Node 24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # 封裝 gate 需要比較 PR 的 base/head，完整歷史讓判定不依賴額外 API 或浮動 action。
          fetch-depth: 0

      - name: 安裝 uv
        # astral-sh/setup-uv v10.3.3 — Node 24；固定到 immutable release commit。
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: 同步相依
        run: uv sync --dev

      - name: 判定 macOS 封裝 gate
        id: packaging
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/ci\.yml|pyproject\.toml|uv\.lock|aurora-macos\.spec|tools/(build_app|pyinstaller_gate)\.py|src/aurora/__init__\.py|src/aurora/__main__\.py|src/aurora/core/paths\.py|src/aurora/platform/|src/aurora/qml/|data/)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "macOS frozen bundle verification required."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No macOS packaging-sensitive changes."
          fi

      - name: 還原測試素材快取
        id: fixtures
        # actions/cache v6.1.0 — Node 24；固定到官方 release commit。
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tests/_generated
          key: fixtures-${{ runner.os }}-${{ hashFiles('tools/make_test_audio.py') }}

      # macOS runner 同樣沒有預裝 ffmpeg（2026-08 確認過 macos-14-Readme），
      # 但有 Homebrew。brew 的 ffmpeg 相依很多、裝起來慢，所以上面的素材
      # 快取在這個 job 上比在 Windows 上更有價值。
      - name: 安裝 ffmpeg
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: brew install ffmpeg

      - name: 產生測試素材
        if: steps.fixtures.outputs.cache-hit != 'true'
        env:
          PYTHONUTF8: "1"
        run: uv run python tools/make_test_audio.py

      - name: 確認素材齊全
        run: |
          missing=0
          for f in test.wav test.flac test.ogg test_128k.mp3 test_320k.mp3 \
                   fake_lossless.flac cover.png test.lrc test_320k.lrc; do
            if [ ! -s "tests/_generated/$f" ]; then
              echo "缺少或為空：tests/_generated/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "測試素材不完整，測試套件會靜默縮水。"; exit 1; }
          echo "素材齊全。"

      - name: Ruff
        run: uv run ruff check .

      # platform_win/ 是 Windows 專屬程式碼，在 macOS 上型別檢查它沒有意義：
      # typeshed 把 winreg 與 ctypes.wintypes 標成 win32 專屬，這裡會冒出
      # 41 個 "Module has no attribute" —— 那些不是缺陷，是平台假設不成立。
      #
      # --exclude 把它們移出檢查清單，--follow-imports=silent 讓
      # platform/windows.py 仍然 import 得到型別資訊但不報它們的錯。
      # 已驗證這個組合仍抓得到其他檔案的真錯（本機注入過一個回傳型別錯誤，
      # 有被抓到），不是靠關掉檢查換綠燈。
      #
      # Windows job 那邊照常做完整檢查（37 檔），這裡是 32 檔。
      - name: mypy
        run: uv run mypy --exclude 'platform_win' --follow-imports=silent

      # test_endpoint.py 整檔會依 skipif 跳過（Windows 專屬），這是預期的。
      # 真正要看的是 core/ library/ audio/ 與 platform 契約在 macOS 上都綠。
      - name: pytest
        run: uv run pytest -m "not audio" -rs

      # 這一條是 macOS job 的重點：它會實例化所有控制器（因此走過
      # platform adapter 的選擇路徑）並載入全部 QML 與著色器。
      # 只證明載得起來，不證明畫面正確 —— 外觀仍需實機確認。
      - name: QML 離屏載入
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run aurora --validate-qml

      - name: macOS frozen bundle 驗證
        if: github.event_name == 'pull_request' && steps.packaging.outputs.required == 'true'
        run: uv run python tools/build_app.py --verify
